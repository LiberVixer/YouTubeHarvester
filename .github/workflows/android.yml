name: Android validation and release

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/install_android_sdk.sh']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/install_android_sdk.sh']
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: bash .github/scripts/install_android_sdk.sh 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Validate and assemble all ABIs
        working-directory: android
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          ./gradlew testDebugUnitTest lintRelease assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon
          python3 scripts/elf_alignment.py app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-validation
          path: |
            android/app/build/reports/
          retention-days: 14

  device-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install compile SDK
        run: bash .github/scripts/install_android_sdk.sh 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run on Android emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-device-tests-${{ matrix.api }}
          path: android/app/build/reports/androidTests/

  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: [build, device-tests]
    permissions:
      contents: write
    environment: android-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yth-release.jks"
      - name: Install compile SDK
        run: bash .github/scripts/install_android_sdk.sh 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Fetch reviewed runtime sources
        env:
          SOURCE_URL: ${{ vars.ANDROID_SOURCE_URL }}
          SOURCE_SHA256: ${{ vars.ANDROID_SOURCE_SHA256 }}
        run: python3 android/scripts/fetch_runtime_sources.py --output "$RUNNER_TEMP/runtime-sources.tar.gz"
      - name: Build signed release
        working-directory: android
        env:
          YTH_ANDROID_KEYSTORE: ${{ runner.temp }}/yth-release.jks
          YTH_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          YTH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YTH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify and package release
        env:
          YTH_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: python3 android/scripts/package_release.py --tag "$GITHUB_REF_NAME" --sources "$RUNNER_TEMP/runtime-sources.tar.gz"
      - name: Publish APKs and corresponding sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-dev* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" android/dist/* --title "YouTube Harvester ${GITHUB_REF_NAME#android-v} for Android" --generate-notes "${flags[@]}"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/yth-release.jks"
