name: Controlled Android native runtime rebuild

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to rebuild
        type: choice
        default: all
        options: [all, aarch64, arm, i686, x86_64]

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'all' && '["aarch64","arm","i686","x86_64"]' || format('["{0}"]', inputs.architecture)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: application
      - name: Check runtime preflight regressions
        run: python3 -m unittest discover -s application/android/scripts -p test_preflight_controlled_runtime.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: termux/termux-packages
          ref: 7c74f85f3b36991d07d4cfb0d1be458c1b4f0896
          path: termux-packages
          persist-credentials: false
      - name: Rebuild Python, FFmpeg and dependencies from pinned recipes
        run: |
          bash application/android/scripts/build_controlled_runtime.sh \
            '${{ matrix.architecture }}' "$PWD/termux-packages" "$PWD/application" \
            "$PWD/runtime-output"
      - name: Preserve native packages, sources and build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controlled-runtime-${{ matrix.architecture }}
          path: |
            runtime-output/
            !runtime-output/packages/**
          retention-days: 14
          if-no-files-found: error
