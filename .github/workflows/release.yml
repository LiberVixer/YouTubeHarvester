name: Build YouTube Harvester Release

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_VERSION: 1.1.0
  DEB_VERSION: 1.1.0
  MSI_VERSION: 1.1.0
  RELEASE_TITLE: YouTube Harvester 1.1.0

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot python3

      - name: Validate scripts
        run: |
          python3 -m py_compile tray_launcher.py yth_common.py i18n_locales.py scripts/downloader.py scripts/check_channel_sections.py scripts/mark_channel_archived.py scripts/migrate_archive_details.py
          bash -n run_download.sh packaging/build_deb.sh packaging/build_release.sh start_tray.sh

      - name: Build Linux release files
        run: |
          bash packaging/build_release.sh "$DEB_VERSION" "$APP_VERSION"

      - name: Smoke-test Linux package contents
        run: |
          test -s "dist/release/YouTubeHarvester_${APP_VERSION}_linux_all.deb"
          test -s "dist/release/YouTubeHarvester_${APP_VERSION}_source.tar.gz"
          test -s "dist/release/SHA256SUMS-linux.txt"
          dpkg-deb --info "dist/release/YouTubeHarvester_${APP_VERSION}_linux_all.deb"
          dpkg-deb --contents "dist/release/YouTubeHarvester_${APP_VERSION}_linux_all.deb" | grep -F '/opt/yt-harvester/i18n_locales.py'
          dpkg-deb --contents "dist/release/YouTubeHarvester_${APP_VERSION}_linux_all.deb" | grep -F '/opt/yt-harvester/assets/ui.dat'
          sha256sum --check "dist/release/SHA256SUMS-linux.txt"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-harvester-linux
          path: |
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_linux_all.deb
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_source.tar.gz
            dist/release/SHA256SUMS-linux.txt

      - name: Attach Linux files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          prerelease: false
          body_path: docs/releases/${{ env.APP_VERSION }}.md
          files: |
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_linux_all.deb
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_source.tar.gz
            dist/release/SHA256SUMS-linux.txt

  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install installer toolchains
        shell: powershell
        run: |
          choco install innosetup wixtoolset -y
          $wix = Get-Command wix.exe -ErrorAction SilentlyContinue
          if ($wix) {
            & $wix.Source eula accept wix7
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not auto-accept WiX v7 OSMF/EULA terms; setup EXE and ZIP can still be built."
            }
          }

      - name: Validate Python files
        shell: powershell
        run: |
          python -m py_compile tray_launcher.py yth_common.py i18n_locales.py scripts/downloader.py scripts/check_channel_sections.py scripts/mark_channel_archived.py scripts/migrate_archive_details.py

      - name: Build Windows release files
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\packaging\windows\build_release.ps1 -Version "$env:APP_VERSION" -MsiVersion "$env:MSI_VERSION"

      - name: Smoke-test Windows portable build
        shell: powershell
        run: |
          $release = Join-Path $PWD "dist\release"
          $app = Join-Path $PWD "dist\windows\YouTubeHarvester"
          $exe = Join-Path $app "YouTubeHarvester.exe"
          $required = @(
            $exe,
            (Join-Path $app "ffmpeg\ffmpeg.exe"),
            (Join-Path $app "ffmpeg\ffprobe.exe"),
            (Join-Path $app "deno\deno.exe"),
            (Join-Path $release "YouTubeHarvester_${env:APP_VERSION}_windows_portable.zip"),
            (Join-Path $release "YouTubeHarvester_${env:APP_VERSION}_windows_setup.exe"),
            (Join-Path $release "YouTubeHarvester_${env:APP_VERSION}_windows_x64.msi"),
            (Join-Path $release "SHA256SUMS-windows.txt")
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing Windows release file: $path" }
          }
          & $exe --run-yt-dlp --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled yt-dlp smoke test failed: $LASTEXITCODE" }
          & $exe --run-script check_channel_sections.py --help
          if ($LASTEXITCODE -ne 0) { throw "Bundled helper smoke test failed: $LASTEXITCODE" }
          & (Join-Path $app "ffmpeg\ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg smoke test failed: $LASTEXITCODE" }
          & (Join-Path $app "ffmpeg\ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffprobe smoke test failed: $LASTEXITCODE" }
          & (Join-Path $app "deno\deno.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno smoke test failed: $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-harvester-windows
          path: |
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_portable.zip
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_setup.exe
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_x64.msi
            dist/release/SHA256SUMS-windows.txt

      - name: Attach Windows files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_TITLE }}
          prerelease: false
          body_path: docs/releases/${{ env.APP_VERSION }}.md
          files: |
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_portable.zip
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_setup.exe
            dist/release/YouTubeHarvester_${{ env.APP_VERSION }}_windows_x64.msi
            dist/release/SHA256SUMS-windows.txt
